name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skm
          POSTGRES_PASSWORD: skm
          POSTGRES_DB: skm
        ports: ['55440:5432']
        options: >-
          --health-cmd "pg_isready -U skm"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # The connector and end-to-end suites deploy keys to real sshd. Two
      # containers, because those two test packages run in parallel and both
      # manage the same account's authorized_keys.
      - name: Start SSH targets
        run: |
          docker build -t skm-test-sshd -f deploy/test/Dockerfile.sshd deploy/test
          docker run -d --name skm_sshd_1 -p 52201:22 skm-test-sshd
          docker run -d --name skm_sshd_2 -p 52202:22 skm-test-sshd
          sleep 5

      - name: Lint
        run: make lint

      - name: Security invariants
        run: make audit-source

      - name: Test
        env:
          SKM_TEST_DATABASE_URL: postgres://skm:skm@localhost:55440/skm?sslmode=disable
          SKM_TEST_SSH_ADDR: localhost:52201
          SKM_TEST_SSH_ADDR_E2E: localhost:52202
        run: cd backend && go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build -- --configuration production

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -f deploy/Dockerfile -t skm-server:ci .
